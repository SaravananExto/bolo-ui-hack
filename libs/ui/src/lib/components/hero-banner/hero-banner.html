<!--
  Responsive hero banner using SCSS.
  Semantic HTML and accessibility best practices.
-->
<section class="hero-banner-section" aria-label="Hero Banner">
  <div class="hero-banner-lang-pallet">
    @for (lng of ['en', 'fr', 'es', 'kn', 'ta', 'te']; track lng) {
    <ui-elm-button
      [text]="'hero.button.' + getLangKey(lng)"
      (click)="switchLocale(lng)"
    ></ui-elm-button>
    }
  </div>
  <div class="hero-banner-theme-switcher">
    <select (change)="changeTheme($event.target)">
      @for (theme of themeNames; track theme) {
      <option [value]="theme" [selected]="currentTheme() === theme">{{ theme }}</option>
      }
    </select>
  </div>
  <h1 class="hero-banner-title">{{ title() | translate }}</h1>
  <p class="hero-banner-subtitle">{{ subtitle() | translate }}</p>
</section>
