<!--
  Responsive hero banner using TailwindCSS.
  Semantic HTML and accessibility best practices.
-->
<section class="hero-banner-section" aria-label="Hero Banner">
  <h1 class="hero-banner-title">{{ title() }}</h1>
  <p class="hero-banner-subtitle">{{ subtitle() }}</p>
  <ui-elm-button [text]="buttonText()" ariaLabel="Call to action"></ui-elm-button>
</section>
