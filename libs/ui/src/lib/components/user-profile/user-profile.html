<p-tabs value="0" class="user-profile">
  <p-tablist>
    <p-tab value="0">{{ 'user_profile.tabs.account' | translate }}</p-tab>
    <p-tab value="1">{{ 'user_profile.tabs.change_password' | translate }}</p-tab>
  </p-tablist>

  <p-tabpanels>
    <!-- USER ACCOUNT TAB -->
    <p-tabpanel value="0">
      <div class="profile-form">
        <div class="profile-form__fields">
          <div class="profile-form__field">
            <label class="profile-form__label" for="firstName"
              >{{ 'user_profile.first_name' | translate }}</label
            >
            <input id="firstName" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="lastName"
              >{{ 'user_profile.last_name' | translate }}</label
            >
            <input id="lastName" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="userName"
              >{{ 'user_profile.user_name' | translate }}</label
            >
            <input id="userName" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="email"
              >{{ 'user_profile.email' | translate }}</label
            >
            <input id="email" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="userRole"
              >{{ 'user_profile.user_role' | translate }}</label
            >
            <input id="userRole" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="workPhone"
              >{{ 'user_profile.work_phone' | translate }}</label
            >
            <input id="workPhone" type="text" pInputText class="profile-form__input" />
          </div>
        </div>

        <div class="profile-actions">
          <button type="button" class="profile-actions__cancel">
            {{ 'user_profile.actions.cancel' | translate }}
          </button>
          <button type="button" class="profile-actions__save">
            {{ 'user_profile.actions.save' | translate }}
          </button>
        </div>
      </div>
    </p-tabpanel>

    <!-- CHANGE PASSWORD TAB -->
    <p-tabpanel value="1">
      <div class="profile-form">
        <div class="profile-form__fields">
          <div class="profile-form__field">
            <label class="profile-form__label" for="oldPassword"
              >{{ 'user_profile.change_password.old' | translate }}</label
            >
            <input id="oldPassword" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="newPassword"
              >{{ 'user_profile.change_password.new' | translate }}</label
            >
            <input id="newPassword" type="text" pInputText class="profile-form__input" />
          </div>

          <div class="profile-form__field">
            <label class="profile-form__label" for="retypeNewPassword"
              >{{ 'user_profile.change_password.retype' | translate }}</label
            >
            <input id="retypeNewPassword" type="text" pInputText class="profile-form__input" />
          </div>
        </div>

        <div class="profile-actions">
          <button type="button" class="profile-actions__cancel">
            {{ 'user_profile.actions.cancel' | translate }}
          </button>
          <button type="button" class="profile-actions__save">
            {{ 'user_profile.actions.save' | translate }}
          </button>
        </div>
      </div>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>
