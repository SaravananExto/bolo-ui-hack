<nav class="chat-sidebar">
  <div class="chat-sidebar__user">
    <p class="chat-sidebar__user-avatar">SH</p>
  </div>

  <div class="chat-sidebar__menu">
    <button class="chat-sidebar__menu-button" (click)="menu.toggle($event)">
      <img alt="More Options" src="assets/images/ellipses-icon.svg" />
    </button>
  </div>

  <div class="chat-sidebar__settings">
    <button class="chat-sidebar__settings-button">
      <img alt="Settings" src="assets/images/settings-icon.svg" />
    </button>
  </div>
</nav>

<p-menu #menu [model]="items" [popup]="true" styleClass="chat-sidebar__menu-dropdown">
  <ng-template #item let-item>
    <a pRipple class="menu-item-link">
      <img [alt]="item.label" [src]="'assets/images/' + item.icon" />
      <span class="menu-item-label">{{ item.label }}</span>
    </a>
  </ng-template>
</p-menu>
