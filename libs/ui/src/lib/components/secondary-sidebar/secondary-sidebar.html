<nav class="chat-sidebar">
  <div class="chat-sidebar__user">
    <p class="chat-sidebar__user-avatar">SH</p>
  </div>

  <div class="chat-sidebar__menu">
    <button class="chat-sidebar__menu-button" (click)="menu.toggle($event)">
      <img alt="More Options" src="assets/icons/ellipses-icon.svg" />
    </button>
  </div>

  <div class="chat-sidebar__settings">
    <button class="chat-sidebar__settings-button" (click)="op.toggle($event)">
      <img alt="Settings" src="assets/icons/settings-icon.svg" />
    </button>
  </div>
</nav>

<p-menu #menu [model]="items" [popup]="true" styleClass="chat-sidebar__menu-dropdown">
  <ng-template #item let-item>
    <a pRipple class="menu-item-link">
      <img [alt]="item.label" [src]="'assets/icons/' + item.icon" />
      <span class="menu-item-label">{{ item.label | translate }}</span>
    </a>
  </ng-template>
</p-menu>

<p-popover #op styleClass="chat-sidebar__settings-popover">
  <div class="settings">
    <h1 class="settings__title">{{ 'user_profile.settings.title' | translate }}</h1>

    <div class="settings__form">
      <div class="settings__field">
        <label class="settings__label" for="company-select"
          >{{ 'user_profile.settings.switch_companies' | translate }}</label
        >
        <p-select
          id="company-select"
          class="settings__select"
          [options]="companies"
          [(ngModel)]="selectedCompany"
          [placeholder]="'user_profile.settings.switch_companies' | translate"
        />
      </div>

      <div class="settings__field">
        <label class="settings__label" for="language-select"
          >{{ 'user_profile.settings.language' | translate }}</label
        >
        <p-select
          id="language-select"
          class="settings__select"
          [options]="languages"
          [(ngModel)]="selectedLanguage"
          [placeholder]="'user_profile.settings.language' | translate"
          (onClick)="switchLocale(selectedLanguage)"
        />
      </div>

      <div class="settings__field">
        <label class="settings__label" for="date-format-select"
          >{{ 'user_profile.settings.date_format' | translate }}</label
        >
        <p-select
          id="date-format-select"
          class="settings__select"
          [options]="dateFormats"
          [(ngModel)]="selectedDateFormat"
          [placeholder]="'user_profile.settings.date_format' | translate"
        />
      </div>

      <div class="settings__field">
        <label class="settings__label" for="theme-color-select"
          >{{ 'user_profile.settings.theme_color' | translate }}</label
        >
        <p-select
          id="theme-color-select"
          class="settings__select"
          [options]="themeColors"
          [(ngModel)]="selectedThemeColor"
          [placeholder]="'user_profile.settings.theme_color' | translate"
          (onClick)="changeTheme(selectedThemeColor)"
        />
      </div>

      <div class="settings__field">
        <label class="settings__label" for="accent-color-select"
          >{{ 'user_profile.settings.accent_color' | translate }}</label
        >
        <p-select
          id="accent-color-select"
          class="settings__select"
          [options]="accentColors"
          [(ngModel)]="selectedAccentColor"
          [placeholder]="'user_profile.settings.accent_color' | translate"
        />
      </div>
    </div>

    <div class="settings__footer">
      <span class="settings__footer-label">{{ 'user_profile.settings.privacy' | translate }}</span>
      <hr />
      <span class="settings__footer-label">{{ 'user_profile.settings.support' | translate }}</span>
    </div>
  </div>
</p-popover>
