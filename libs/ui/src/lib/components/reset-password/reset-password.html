<div class="reset-dialog">
  <button class="close-btn" (click)="onCloseAllClick($event)" aria-label="Close">&times;</button>
  <h2 class="dialog-title">{{ 'reset.title' | translate }}</h2>
  <ng-container>
    <label *ngIf="status() === 'idle'" class="dialog-label" for="reset-email"
      >{{ 'login.usernameOrEmail' | translate }}</label
    >
    <input
      *ngIf="status() === 'idle'"
      pInputText
      class="dialog-input"
      id="reset-email"
      type="text"
      placeholder="sterling.hill@gaeaglobal.com"
      [disabled]="isDisabled"
      [(ngModel)]="emailValue"
    />
    <button
      *ngIf="status() === 'idle'"
      pButton
      class="dialog-login-btn"
      (click)="onSendResetLink()"
      [disabled]="isDisabled"
    >
      {{ 'reset.sendLink' | translate }}
    </button>
    <div *ngIf="status() === 'success'" class="reset-message success">{{ message }}</div>
    <div *ngIf="status() === 'error'" class="reset-message error">{{ message }}</div>
  </ng-container>
  <a class="return-login" href="#" (click)="onReturnToLoginClick($event)"
    >{{ 'reset.returnToLogin' | translate }}</a
  >
  <div class="dialog-footer">©2025 Exto-bolo release 25.10.0</div>
</div>
