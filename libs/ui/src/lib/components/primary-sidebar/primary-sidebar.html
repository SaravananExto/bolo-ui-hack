<nav class="chat-sidebar" [class.chat-sidebar--collapsed]="collapsed()">
  <div class="chat-sidebar__header">
    <img
      alt="App logo"
      [src]="collapsed() ? 'assets/images/intel-small.png' : 'assets/images/intel-large.png'"
    />
  </div>

  <div class="chat-sidebar__options">
    @if (!this.collapsed()) {
    <div class="chat-sidebar__search">
      <img alt="Search" src="assets/icons/search-icon.svg" />
      <input
        class="chat-sidebar__search-input"
        [placeholder]="'sidebar.search.placeholder' | translate"
      />
    </div>
    }

    <div class="chat-sidebar__option">
      <img alt="New Conversation" src="assets/icons/new-conversation-icon.svg" />
      <span class="chat-sidebar__option-text">{{ 'sidebar.newConversation' | translate }}</span>
    </div>

    <div class="chat-sidebar__option">
      <img alt="History" src="assets/icons/history-icon.svg" (click)="onHistoryClick()" />
      <span class="chat-sidebar__option-text">{{ 'sidebar.history' | translate }}</span>
    </div>
  </div>

  <div class="chat-sidebar__middle">
    @if (!this.collapsed()) {
    <div class="chat-history">
      <h2 class="chat-history__title">{{ 'sidebar.pinned' | translate }}</h2>
      <div class="chat-history__list">
        <div class="chat-history__item" (click)="onHistoryClick()">
          <p class="chat-history__message">{{ 'sidebar.exampleMessage' | translate }}</p>
          <button class="chat-history__menu-button" (click)="menu.toggle($event)">
            <img alt="More options" src="assets/icons/ellipses-icon.svg" />
          </button>
        </div>
      </div>
    </div>
    }
  </div>

  <div class="chat-sidebar__footer">
    <div class="chat-sidebar__footer-controls">
      <button
        class="chat-sidebar__toggle-button"
        [class.chat-sidebar__toggle-button--expanded]="!collapsed()"
        (click)="toggle()"
      >
        <img alt="Expand" src="assets/icons/expand-icon.svg" class="chat-sidebar__chevron" />
      </button>
    </div>
  </div>
</nav>

<p-menu #menu [model]="items" [popup]="true" styleClass="chat-history__menu-items">
  <ng-template #item let-item>
    <a pRipple class="menu-item-link">
      <img [alt]="item.label" [src]="'assets/icons/' + item.icon" />
      <span class="menu-item-label">{{ item.label | translate }}</span>
    </a>
  </ng-template>
</p-menu>
